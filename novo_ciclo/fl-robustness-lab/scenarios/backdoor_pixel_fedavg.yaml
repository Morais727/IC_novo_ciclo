# Baseline SEM defesa: expõe o quanto um backdoor pixel-pattern simples
# compromete o modelo (BA/ASR alto) quando agregado por FedAvg puro.
name: backdoor_pixel_fedavg
num_clients: 20
dirichlet_alpha: 0.5
num_malicious: 2
attack: backdoor_pixel
attack_params: {target_label: 0, poison_fraction: 0.5}
backdoor_target_label: 0
defense: fedavg
defense_params: {}
rounds: 40
local_epochs: 1
batch_size: 32
lr: 0.01
server_holdout_size: 100
seed: 42
eval_every: 5
