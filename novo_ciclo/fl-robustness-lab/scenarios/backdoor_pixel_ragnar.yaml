# Ferramenta própria (RAGNAR, Morais et al., 2024) contra backdoor pixel-pattern:
# cenário-alvo para demonstrar a proposta de defesa deste ciclo de pesquisa.
name: backdoor_pixel_ragnar
num_clients: 20
dirichlet_alpha: 0.5
num_malicious: 2
attack: backdoor_pixel
attack_params: {target_label: 0, poison_fraction: 0.5}
backdoor_target_label: 0
defense: ragnar
defense_params: {n_estimators: 60, max_depth: 3}
rounds: 40
local_epochs: 1
batch_size: 32
lr: 0.01
server_holdout_size: 100
seed: 42
eval_every: 5
